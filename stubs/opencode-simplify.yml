name: opencode-simplify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  simplify:
    if: github.event.pull_request.draft == false
    uses: ekawijayasusilo/shared_workflow/.github/workflows/opencode-simplify.reusable.yml@v1.1.0
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

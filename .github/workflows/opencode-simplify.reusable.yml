name: opencode-simplify-reusable

on:
  workflow_call:
    secrets:
      OPENCODE_API_KEY:
        required: false

concurrency:
  group: opencode-simplify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  simplify:
    # Fork PRs and bot-authored PRs (e.g. Dependabot) run without repository
    # secrets, so the action would start with no usable OPENCODE_API_KEY.
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Validate API key
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [[ -z "$OPENCODE_API_KEY" ]]; then
            echo "::error::OPENCODE_API_KEY is required for same-repository human PRs"
            exit 1
          fi

      # PR head (not the detached merge ref) with full history, so the
      # ce-simplify-code skill can resolve its merge-base..HEAD scope (RFC 0002 §3.6).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Prompts live in shared_workflow's prompts/, but this reusable workflow
      # runs in the caller's context (checkout above is the consumer repo), so
      # the prompt is fetched at runtime. Fetched from main by design — callers
      # track @main. $RUNNER_TEMP keeps the reviewed workspace clean.
      - name: Load prompt
        id: prompt
        run: |
          curl -fsSL --retry 3 --max-time 30 --connect-timeout 10 -o "$RUNNER_TEMP/prompt.md" \
            https://raw.githubusercontent.com/ekawijayasusilo/shared_workflow/main/prompts/opencode-simplify.md
          test -s "$RUNNER_TEMP/prompt.md"
          { echo 'text<<PROMPT_EOF'; cat "$RUNNER_TEMP/prompt.md"; echo 'PROMPT_EOF'; } >> "$GITHUB_OUTPUT"

      - name: Load central model config
        id: cfg
        uses: ekawijayasusilo/shared_workflow/.github/actions/model-config@main

      - uses: anomalyco/opencode/github@31406ccc51b4bd2a4e1e086b2bcaa5f7f804f26d # v1.18.18
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Model/variant/plugin come from .github/actions/model-config (central).
          # Merged on top of global + project config ("local" scope), so a
          # consumer repo's own opencode.json still applies.
          OPENCODE_CONFIG_CONTENT: |
            {
              "plugin": ["${{ steps.cfg.outputs.opencode_plugin }}"]
            }
        with:
          model: ${{ steps.cfg.outputs.opencode_model }}
          variant: ${{ steps.cfg.outputs.opencode_variant }}
          use_github_token: true
          prompt: ${{ steps.prompt.outputs.text }}

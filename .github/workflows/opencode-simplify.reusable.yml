name: opencode-simplify-reusable

on:
  workflow_call:
    secrets:
      OPENCODE_API_KEY:
        required: false

concurrency:
  group: opencode-simplify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  simplify:
    # Fork PRs and bot-authored PRs run without repository
    # secrets, so the action would start with no usable OPENCODE_API_KEY.
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Validate API key
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [[ -z "$OPENCODE_API_KEY" ]]; then
            echo "::error::OPENCODE_API_KEY is required for same-repository human PRs"
            exit 1
          fi

      # PR head (not the detached merge ref) with full history, so the
      # ce-simplify-code skill can resolve its merge-base..HEAD scope (RFC 0002 §3.6).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout invoked shared workflow assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflow
          persist-credentials: false

      # Prompts live in shared_workflow's prompts/, but this reusable workflow
      # runs in the caller's context (checkout above is the consumer repo), so
      # fetch the prompt from the exact revision that defined this job.
      # $RUNNER_TEMP keeps the reviewed workspace clean.
      - name: Load prompt
        id: prompt
        run: |
          curl -fsSL --retry 3 --max-time 30 --connect-timeout 10 -o "$RUNNER_TEMP/prompt.md" \
            "https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha }}/prompts/opencode-simplify.md"
          test -s "$RUNNER_TEMP/prompt.md"
          { echo 'text<<PROMPT_EOF'; cat "$RUNNER_TEMP/prompt.md"; echo 'PROMPT_EOF'; } >> "$GITHUB_OUTPUT"

      - name: Load central model config
        id: cfg
        uses: ./.shared-workflow/.github/actions/model-config

      - uses: anomalyco/opencode/github@cb7d8b2f5e44876ef98b661dc10590c915af3a9f # v1.18.25
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Model/variant/plugin come from .github/actions/model-config (central).
          # Merged on top of global + project config ("local" scope), so a
          # consumer repo's own opencode.json still applies.
          OPENCODE_CONFIG_CONTENT: |
            {
              "plugin": ["${{ steps.cfg.outputs.opencode_plugin }}"]
            }
        with:
          model: ${{ steps.cfg.outputs.opencode_model }}
          variant: ${{ steps.cfg.outputs.opencode_variant }}
          use_github_token: true
          prompt: ${{ steps.prompt.outputs.text }}

name: opencode-reusable

on:
  workflow_call:
    secrets:
      OPENCODE_API_KEY:
        required: true

jobs:
  opencode:
    # Never react to bot-authored comments (avoids loops and
    # wasted runs). The opencode action also gates on commenter permission.
    if: github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Default credentials stay on: the comment-triggered assistant needs
      # them to push commits.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout invoked shared workflow assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflow
          persist-credentials: false

      - name: Load central model config
        id: cfg
        uses: ./.shared-workflow/.github/actions/model-config

      - name: Run opencode
        uses: anomalyco/opencode/github@31406ccc51b4bd2a4e1e086b2bcaa5f7f804f26d # v1.18.18
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          model: ${{ steps.cfg.outputs.opencode_model }}
          variant: ${{ steps.cfg.outputs.opencode_variant }}
